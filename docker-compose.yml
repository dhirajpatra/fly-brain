version: "3.8"

# Local Neo4j for the fly-brain connectome graph.
#
#   docker compose up -d
#   Browser: http://localhost:7474  (user: neo4j, password: set via NEO4J_PASSWORD)
#   Bolt:    bolt://localhost:7687
#
# Password is read from the NEO4J_PASSWORD env var (export it or put it in a
# local .env file that is NOT committed). No default is baked in here.

services:
  neo4j:
    image: neo4j:5.24-community
    container_name: fly-brain-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in your environment or .env file}"
      # Sized for the full 783-connectome load (~138k nodes, ~5M edges).
      # Fine for the small first-pass subset too; no need to shrink it.
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - fly-brain-neo4j-data:/data
      - fly-brain-neo4j-logs:/logs
      - fly-brain-neo4j-import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  fly-brain-neo4j-data:
  fly-brain-neo4j-logs:
  fly-brain-neo4j-import:
